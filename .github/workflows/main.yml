name: cicd withe test case

on:
  push:
    branches: ["main"]


Jobs:
   build-test:
     runs-on: ubuntu-latest
     steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
               
      - name: Run test script
        run: python test.py
